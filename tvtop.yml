version: '3.3'
services:
  tvtop:
    image: tvtop_pbcs:1.1_Intraer
    container_name: tvtop_app
    environment:
      - VIRTUAL_HOST=tvtop.cindacta3.intraer
      - VIRTUAL_PORT=8501
      - HTTPS_METHOD=nohttps
    ports:
      - "8501:8501"
    networks:
      - rdecntrs-gort
    restart: always

networks:
  rdecntrs-gort:
    external: true
